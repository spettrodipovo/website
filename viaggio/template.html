<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template comunicazioni viaggio Spettro</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f4; font-family:Arial, Helvetica, sans-serif; color:#26332b;">

<!-- CONTENITORE ESTERNO -->

<table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
       style="background-color:#f4f6f4;">
  <tr>
    <td align="center" style="padding:40px 15px;">

      <!-- CONTENITORE EMAIL -->
      <table role="presentation" width="600" border="0" cellspacing="0" cellpadding="0"
             style="max-width:600px; width:100%; background-color:#ffffff; border-radius:20px;">

        <!-- HEADER -->
        <tr>
          <td style="padding:30px 35px 28px 35px;">

            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>

                <!-- LOGO -->
                <td width="120" valign="middle" style="width:120px;">
                  <img
                    src="https://raw.githubusercontent.com/spettrodipovo/website/refs/heads/main/viaggio/img/spettro.png"
                    alt="Spettro di Povo"
                    width="120"
                    style="display:block; width:120px; max-width:120px; height:auto; border:0;"
                  >
                </td>

                <!-- INFORMAZIONI VIAGGIO -->
                <td valign="middle" align="right"
                    style="padding-left:0px;">

                  <p style="margin:0 0 5px 0; font-size:18px; line-height:1.25; font-weight:bold; color:#315b3d; text-align:right;">
                    Viaggio a Roma e Frascati
                  </p>

                  <p style="margin:0; font-size:14px; line-height:1.4; color:#7a857e; text-align:right;">
                    15 – 17 ottobre 2026
                  </p>

                </td>

              </tr>
            </table>

          </td>
        </tr>

        <!-- LINEA -->
        <tr>
          <td style="padding:0 35px;">

            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
              <tr>
                <td style="height:1px; line-height:1px; font-size:1px; background-color:#edf1ed;">
                  &nbsp;
                </td>
              </tr>
            </table>

          </td>
        </tr>

        <!-- CONTENUTO -->
        <tr>
          <td style="padding:32px 35px 35px 35px;">

            <!-- Titolo -->
            <h1 style="margin:0 0 14px 0; font-size:28px; line-height:1.2; font-weight:700; color:#315b3d;">
              Titolo
            </h1>

            </br>

            <!-- Saluto -->
            <p style="margin:0 0 22px 0; font-size:16px; line-height:1.6; color:#4d5951;">
              Ciao <strong style="color:#315b3d;">{}</strong>,
            </p>

            <!-- Testo introduttivo -->
            <p align="justify" style="margin:0 0 22px 0; font-size:16px; line-height:1.7; color:#4d5951;">
              Corpo
            </p>


            <!-- SALUTI -->
            <p style="margin:28px 0 0 0; font-size:15px; line-height:1.7; color:#4d5951;">
              A presto!<br>
              <strong style="color:#315b3d;">Il team Spettro di Povo</strong>
            </p>

            
            <!-- Separatore -->
            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
                  style="margin-top:42px;">
              <tr>
                <td style="border-top:1px solid #edf1ed; padding-top:18px;">

                </td>
              </tr>
            </table>

            <!-- SPONSOR / PATROCINI -->
            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
                  style="width:100%; margin-top:0px;">

              <!-- TITOLO -->
              <tr>
                <td colspan="5"
                    style="padding:0 0 18px 0;">

                  <p style="margin:0; font-size:12px; line-height:1.4; color:#89938d; text-align:center;">
                    CON IL CONTRIBUTO FINANZIARIO DI:
                  </p>

                </td>
              </tr>

                <!-- LOGHI -->
                <td width="20%" align="center" valign="middle"
                    style="width:20%; padding:0 5px;">

                  <img
                    src="/Users/giacomofontanive/Desktop/viaggio/img/sponsors.png"
                    alt="Sponsors"
                    width="500"
                    style="display:block; width:500px; max-width:100%; height:auto; border:0; margin:0 auto;"
                  >

                </td>


            </table>

            <!-- SEPARATORE -->
            <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
                   style="margin-top:32px;">
              <tr>
                <td style="border-top:1px solid #edf1ed; padding-top:18px;">

                  <p style="margin:0; font-size:12px; line-height:1.5; color:#89938d; text-align:center;">
                    Viaggio a Roma e Frascati &nbsp;|&nbsp; 15 – 17 ottobre 2026
                  </p>

                </td>
              </tr>
            </table>

          </td>
        </tr>


        <!-- FOOTER -->
        <tr>
          <td style="padding:20px 35px 23px 35px; background-color:#f8faf8; border-top:1px solid #edf1ed; border-radius:0 0 14px 14px;">

            <p style="margin:0; font-size:11px; line-height:1.6; color:#89938d; text-align:center;">
              <strong style="color:#68736c;">Associazione Studentesca Spettro di Povo</strong><br>
              Università degli Studi di Trento
            </p>

          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
